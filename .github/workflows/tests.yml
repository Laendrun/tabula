name: tests
on: [push, pull_request]

jobs:
  cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]              # the oldest supported (pyproject: >=3.9) and the newest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "./cli[test]"     # tabula + pyyaml + pytest, from cli/pyproject.toml
      - run: pytest -q tests
      - run: tabula --vault examples/vault check
      - run: tabula --vault examples/vault fmt --check   # the examples stay tidy

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7          # the extension reads files through `tabula outline`
        with:
          python-version: "3.13"
      - run: pip install -e ../../cli
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test                          # the extension's logic and its grammar
      - run: npm run package                   # builds <name>-<version>.vsix (tabula-syntax-0.4.0.vsix)
      - uses: actions/upload-artifact@v7       # downloadable from the run's page, kept 30 days
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          retention-days: 30

  neovim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e ./cli                # the plugin runs tabula for checks and formatting
      - run: |
          curl -sSL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | tar xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: nvim --headless -u NONE -l editors/nvim/tests/test.lua
      - run: nvim --headless -u NONE -l editors/nvim/tests/root.lua    # what lazy.nvim installs
