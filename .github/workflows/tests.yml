name: tests
on: [push, pull_request]

jobs:
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -e "./cli[test]"     # tabula + pyyaml + pytest, from cli/pyproject.toml
      - run: pytest -q tests
      - run: tabula --vault examples/vault check

  vscode:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm test                          # the extension's logic and its grammar
      - run: npm run package                   # builds <name>-<version>.vsix (tabula-syntax-0.4.0.vsix)
      - uses: actions/upload-artifact@v4       # downloadable from the run's page, kept 30 days
        with:
          name: vscode-extension
          path: editors/vscode/*.vsix
          retention-days: 30

  publish:
    # Publishes the extension to the VS Code Marketplace, so VS Code updates it by itself.
    # Runs on pushes to main, after both test jobs pass, and only when package.json has a version
    # that isn't on the Marketplace yet: bump "version" in editors/vscode/package.json to release.
    # Needs the VSCE_PAT secret (see editors/vscode/README.md); without it, the job does nothing.
    needs: [cli, vscode]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - uses: actions/download-artifact@v4     # the .vsix the vscode job built and tested
        with:
          name: vscode-extension
          path: editors/vscode
      - run: npm ci
      - name: Publish if the version is new
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::notice::VSCE_PAT secret not set: not publishing to the Marketplace"
            exit 0
          fi
          id=$(node -p "const p = require('./package.json'); p.publisher + '.' + p.name")
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          published=$(npx vsce show "$id" --json 2>/dev/null \
            | node -e "let s = ''; process.stdin.on('data', d => s += d).on('end', () => {
                try { console.log(JSON.parse(s).versions[0].version) } catch { console.log('') } })")
          if [ "$published" = "$version" ]; then
            echo "$id $version is already on the Marketplace: nothing to publish"
            exit 0
          fi
          echo "publishing $id $version (Marketplace has: ${published:-nothing yet})"
          npx vsce publish --packagePath "$name-$version.vsix" --skip-license
