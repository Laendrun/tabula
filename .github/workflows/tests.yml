name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-pyton@v5
        with:
          python-version: "3.13"
      - run: pip install pyyaml pytest
      - run: pytest -q
      - run: python tabuly.py --vault vault check