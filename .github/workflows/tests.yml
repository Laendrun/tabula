name: tests
on: pull_request                         # pull requests only (opened, updated); not every push

jobs:
  cli:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e "./cli[test]"     # tabula + pyyaml + pytest, from cli/pyproject.toml
      - run: pytest -q tests
      - run: tabula --vault examples/vault check
      - run: tabula --vault examples/vault fmt --check   # the examples stay tidy

  vscode:
    runs-on: ubuntu-26.04
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7          # the extension reads files through `tabula outline`
        with:
          python-version: "3.13"
      - run: pip install -e ../../cli
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
      - run: npm run build                     # schemas/ (from spec/schemas) and dist/extension.js: what the .vsix contains
      - run: npm test                          # the extension's logic and its grammar (the .vsix: vsix.yml, on merge)

  neovim:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e "./cli[lsp]"         # the plugin starts the language server: tabula lsp
      - run: |
          curl -sSL https://github.com/neovim/neovim/releases/download/v0.11.4/nvim-linux-x86_64.tar.gz | tar xz
          echo "$PWD/nvim-linux-x86_64/bin" >> "$GITHUB_PATH"
      - run: nvim --headless -u NONE -l editors/nvim/tests/test.lua
      - run: nvim --headless -u NONE -l editors/nvim/tests/root.lua    # what lazy.nvim installs
