[project]
name = "tabula"
version = "0.2.0"
description = "Board & card game rules in Markdown: show, filter by player count, check."
requires-python = ">=3.9"
dependencies = ["pyyaml>=6"]

[project.scripts]
tabula = "tabula:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["tabula"]
