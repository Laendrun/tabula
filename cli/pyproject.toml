[project]
name = "tabula"
version = "0.8.2"
description = "Board & card game rules in Markdown: show, filter by player count, check."
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tabula = "tabula.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["tabula"]

[tool.pytest.ini_options]
testpaths = ["tests"]
